name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit tests, build, cdk synth
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build (API bundle, large-object worker bundle, web app)
        run: npm run build
      - name: Build the container images (they are otherwise built only at deploy time)
        run: |
          docker build -f apps/api/Dockerfile -t s3up-api:ci .
          docker build -f functions/large-worker/Dockerfile -t s3up-large-worker:ci .
      - name: cdk synth (LocalStack-compatible stack)
        run: npm run synth
      - name: cdk synth (with the Fargate API)
        run: npm run synth:api
      - name: cdk synth (API, Cognito, CloudFront web app, malware scan and the large-object worker)
        run: npm run synth:full

  integration:
    name: Integration and browser tests (LocalStack)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      localstack:
        # Pinned: images from 2026.03 onward need an auth token; 4.14.0 does not.
        image: localstack/localstack:4.14.0
        ports:
          - 4566:4566
        env:
          SERVICES: s3,sqs,lambda,dynamodb,cloudformation,sns,cloudwatch,iam,sts,ssm,events,logs,kms
          LAMBDA_RUNTIME_ENVIRONMENT_TIMEOUT: "120"
        volumes:
          # LocalStack runs the worker Lambda as a sibling container.
          - /var/run/docker.sock:/var/run/docker.sock
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Deploy the CDK stack into LocalStack
        run: npm run localstack:deploy
      - name: Integration tests (generates and uploads a ~200 MB file)
        run: npm run test:integration
      - name: Install the browser for the end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (browser, API and LocalStack)
        run: npm run test:e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: LocalStack logs
        if: failure()
        run: docker logs "${{ job.services.localstack.id }}" 2>&1 | tail -n 300
